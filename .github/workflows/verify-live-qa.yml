name: Verify 10 Render QA Bench Deployments
on:
  push:
    branches: [main]
    paths:
      - "qa/verify-live.mjs"
      - ".github/workflows/verify-live-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-qa-on-render:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify 10 existing Render deployments
        run: node qa/verify-live.mjs
      - name: Publish live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-render-live-verification
          path: artifacts/qa-live-deploy-verification.json
          if-no-files-found: warn
