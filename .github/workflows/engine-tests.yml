name: deliverycommand Business Rules and Scenario Tests
on:
  push:
    branches: [main]
    paths:
      - "deliverycommand/engine.mjs"
      - "deliverycommand/tests/**"
      - ".github/workflows/engine-tests.yml"
  pull_request:
  workflow_dispatch:
jobs:
  unit-scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute real model assertions
        run: node --test deliverycommand/tests/engine.test.mjs
